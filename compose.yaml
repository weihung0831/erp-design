services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - 127.0.0.1:${PORT:-3300}:8080
    env_file: .env
    networks:
      - default
      - shared-db
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  shared-db:
    external: true
